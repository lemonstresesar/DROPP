<script>
  (function initStoryInteractions() {
    const playBtn = document.getElementById('toggle-play-btn');
    const playIcon = document.getElementById('play-icon');
    const progressBar = document.getElementById('story-progress-active');
    const likeBtn = document.getElementById('like-btn');
    const likeIcon = document.getElementById('like-icon');
    const likeCount = document.getElementById('like-count');

    let isPlaying = true;
    let progress = 45;
    let timer = null;

    function runProgress() {
      if (!isPlaying) return;
      progress += 0.8;
      if (progress >= 100) {
        progress = 100;
        clearInterval(timer);
      }
      if (progressBar) {
        progressBar.style.width = progress + '%';
      }
    }

    timer = setInterval(runProgress, 100);

    if (playBtn && playIcon) {
      playBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        isPlaying = !isPlaying;
        playIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
      });
    }

    if (likeBtn && likeIcon && likeCount) {
      let liked = false;
      likeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        liked = !liked;
        likeIcon.style.fontVariationSettings = liked ? "'FILL' 1" : "'FILL' 0";
        likeIcon.style.color = liked ? '#ff5a1f' : 'currentColor';
        likeCount.textContent = liked ? '343' : '342';
      });
    }

    const tapPrev = document.getElementById('tap-prev');
    const tapNext = document.getElementById('tap-next');

    if (tapPrev) {
      tapPrev.addEventListener('click', () => {
        progress = Math.max(0, progress - 30);
        if (progressBar) progressBar.style.width = progress + '%';
      });
    }

    if (tapNext) {
      tapNext.addEventListener('click', () => {
        progress = Math.min(100, progress + 30);
        if (progressBar) progressBar.style.width = progress + '%';
      });
    }
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.5)]" data-active-classes="text-primary-container font-semibold"><div class="flex justify-around items-center h-16 px-space-xs"><a aria-current="page" class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] transition-colors text-primary-container font-semibold" data-path="accueil" href="#"><span class="material-symbols-outlined text-[24px]">home</span><span class="font-label-sm text-label-sm mt-0.5">Accueil</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] text-on-surface-variant transition-colors" data-path="marche" href="#"><span class="material-symbols-outlined text-[24px]">storefront</span><span class="font-label-sm text-label-sm mt-0.5">Marché</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] -mt-5 group" data-path="creer-un-drop" href="#"><div class="w-12 h-12 rounded-full bg-primary-container text-white flex items-center justify-center shadow-lg shadow-primary-container/30 transition-transform active:scale-95"><span class="material-symbols-outlined text-[28px]">add</span></div></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] text-on-surface-variant transition-colors relative" data-path="messages" href="#"><div class="relative"><span class="material-symbols-outlined text-[24px]">chat_bubble</span><span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-primary-container rounded-full ring-2 ring-surface-container-lowest"></span></div><span class="font-label-sm text-label-sm mt-0.5">Messages</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] text-on-surface-variant transition-colors" data-path="profil" href="#"><span class="material-symbols-outlined text-[24px]">person</span><span class="font-label-sm text-label-sm mt-0.5">Profil</span></a></div></nav></body></html

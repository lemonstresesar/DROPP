<script>
    // Micro-interaction for capture trigger and tactile visual feedback
    (function initCameraTriggers() {
      const trigger = document.getElementById('recordTriggerBtn');
      if (!trigger) return;

      let isRecording = false;

      trigger.addEventListener('click', () => {
        isRecording = !isRecording;
        if (isRecording) {
          trigger.classList.add('scale-105');
          const innerCore = trigger.querySelector('.rounded-full.bg-on-primary-container');
          if (innerCore) {
            innerCore.classList.remove('rounded-full');
            innerCore.classList.add('rounded-sm');
          }
        } else {
          trigger.classList.remove('scale-105');
          const innerCore = trigger.querySelector('.rounded-sm.bg-on-primary-container');
          if (innerCore) {
            innerCore.classList.remove('rounded-sm');
            innerCore.classList.add('rounded-full');
          }
        }
      });
    })();
